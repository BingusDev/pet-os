# AlicePET OS config. Installed as /etc/alicepet.conf (a dpkg conffile, so
# local edits survive upgrades). Desktop builds read this repository copy;
# ALICEPET_CONFIG=<path> overrides the location on both.
#
# Keep your own hosts, servers and secrets out of this file: put them in
# alicepet.local.conf next to it (/etc/alicepet.local.conf on the PET). It is
# read after this one, its values win and its host= lines are added. It is not
# packaged and is ignored by git.

[bridge]
# Talk-to-Alice bridge (cardputer-pet-terminal bridge/server.mjs protocol):
# POST <url>/api/pet/ask {"input": "..."} -> {"ok": true, "reply": "..."}.
# Example: url=http://my-mac.tailnet.ts.net:8797 (empty = chat is off)
url=
# Bearer token = PET_BRIDGE_TOKEN on the Mac. Leave empty only if the bridge has none.
# Never commit a real token here; set it in alicepet.local.conf on the device.
token=
timeout_s=60

[netscan]
# host=<display name>|<address>|<probe>
# probe: tcp:<port>  -> ONLINE if a TCP connect succeeds
#        ps5         -> PlayStation discovery (UDP 9302): ONLINE / REST (standby) / OFFLINE
timeout_ms=1500
# Examples:
#   host=Router|192.168.1.1|tcp:80
#   host=NAS|192.168.1.20|tcp:445
#   host=PS5|192.168.1.30|ps5

[power]
# Nap after this many idle seconds (screen/backlight off, any key wakes to Home). 0 = never.
sleep_after_s=300
# Backlight sysfs dir; "auto" = first entry in /sys/class/backlight.
backlight=auto
# The backlight is the biggest power draw: dim it to dim_percent of max after
# this many idle seconds (any key restores it). 0 = never dim.
dim_after_s=45
dim_percent=15
# Per-chip power profiles: each chip turns on only what it needs (CPU cores,
# Wi-Fi), napping drops to one core at the lowest clock with Wi-Fi power save,
# and Bluetooth and the ACT LED stay off. Needs root (or udev rules) for sysfs.
# Turn on after the device-day checks: profiles=on
profiles=off

[voice]
# Push-to-talk (hold SPACE on Home, or SPACE inside the VOICE chip). The WAV
# path is appended as the last argument; the recorder is stopped with SIGINT.
record_cmd=arecord -q -D default -f S16_LE -r 16000 -c 1 -t wav
max_s=30
# Optional spoken replies: the reply text is piped to this command's stdin.
# Empty = off (default). Example: tts_cmd=espeak-ng -v en-us -s 165
tts_cmd=
# Desktop simulator only: send this WAV instead of recording (no mic).
desktop_wav=

[terminal]
# SSH bookmarks: host=<label>|<ssh target>|<note>[|<port>]
# The target is passed to `ssh -tt`, so user@host or an alias from the PET's
# ~/.ssh/config both work. The PET uses its own SSH key (Phase 0 setup).
# Example: host=home-pi|pi@192.168.1.10|Pi · home
# Also list Host entries from this ssh_config that are not bookmarked ("" = off).
ssh_config_import=~/.ssh/config
ssh_cmd=ssh

[jellyfin]
# Server address (http:// is built in; https:// works through the system curl).
# Away from home use the server's Tailscale address. Empty = JELLYFIN is off.
# Example: url=http://192.168.1.50:8096
url=
# Jellyfin API key (Dashboard -> API Keys). Secret: set it in
# alicepet.local.conf on the device only, never in this repository copy.
api_key=
# User name or id whose library/resume points are used (empty = first user).
user=
# Player for the server-side H.264 transcode; the HLS URL is appended. mpv is
# driven over its IPC socket (pause/seek/volume, resume position). Any other
# player is just started and stopped, e.g.:
#   player=ffmpeg -loglevel quiet -re -i  ... (needs an output to /dev/fb0)
# The API key reaches mpv as an HTTP header from a private temp file, never on
# the command line. Device-day checks: --vo=drm uses the first DRM card, which on
# Pi hardware may be HDMI rather than the panel (add --drm-device=/dev/dri/cardN),
# and --hwdec=v4l2m2m-copy may be needed for the hardware H.264 decoder.
player=mpv --really-quiet --fs --vo=drm --hwdec=auto --ao=pipewire,pulse,alsa
max_bitrate=450000
width=320

[remote]
# IR through LIRC's ir-ctl (apt install v4l-utils). Device-day check: which
# /dev/lircN is the transmitter and which the receiver (ir-ctl -f -d /dev/lircN).
send_device=/dev/lirc0
recv_device=/dev/lirc1
# Learned remotes (<name>.remote) and macros (<name>.macro) live here. A macro:
#   name=Tournament mode
#   step=Projector|POWER
#   step=wait|20
#   step=Projector|HDMI2
dir=~/.config/alicepet/remotes

[romm]
# RomM server for RETRO (REST API). token = a RomM API token, sent as a Bearer
# header. Secret: set url and token in alicepet.local.conf on the device.
url=
token=

[retro]
# Emulator command: {core}, {rom} and {savedir} are replaced. RetroArch's menu
# is F1. -s {savedir} keeps saves where the PET syncs them with RomM.
player=retroarch --fullscreen -L {core} -s {savedir} {rom}
# Pull a newer save from RomM before playing and upload it after (needs a
# token with assets.read and assets.write). Sync pauses while the PET's clock
# is wrong. If RomM's newer save can't be fetched and you play anyway, the PET
# save is marked <save>.srm.conflict and is not uploaded: delete that file to
# upload the PET's save next time you play, or delete the .srm to take RomM's.
sync_saves=on
# Downloaded games (and the saves the emulator writes next to them).
dir=~/.local/share/alicepet/roms
# libretro core per RomM platform slug. Device-day check: the paths from
# `apt install libretro-gambatte libretro-mgba libretro-snes9x ...`.
core_gb=/usr/lib/libretro/gambatte_libretro.so
core_gbc=/usr/lib/libretro/gambatte_libretro.so
core_gba=/usr/lib/libretro/mgba_libretro.so
core_nes=/usr/lib/libretro/fceumm_libretro.so
core_snes=/usr/lib/libretro/snes9x_libretro.so
core_genesis-slash-megadrive=/usr/lib/libretro/genesis_plus_gx_libretro.so

[lantech]
# Interface to test (empty = first wired one with a link, else Wi-Fi).
interface=
# Speed test after a good jack test: about 25 MB down and 10 MB up.
speed_test=on
speed_down_url=https://speed.cloudflare.com/__down?bytes=25000000
speed_up_url=https://speed.cloudflare.com/__up
# [S] saves a text report here; "who's new" remembers devices per network here.
report_dir=~/lan-reports
known_dir=~/.config/alicepet/lan-known
# [V] when DHCP fails: temporary static addresses to try, in order (needs root).
# Default guesses are 192.168.1.250, 192.168.0.250 and 10.0.0.250 (/24, .1 gateway).
# static=192.168.50.250/24|192.168.50.1

[jackin]
# JACK IN: the PET shows up on a PC as a USB drive (the Jack In app) plus a
# USB network link. The app dials the PET here; nothing on the PC listens.
listen=10.55.0.1
port=7341
# "Share PC Internet": the PC dials back on tunnel_port; PET programs use the
# proxy on 127.0.0.1:proxy_port while sharing is on.
tunnel_port=7342
# Video and games play in the PC app while jacked in: the PC fetches them from
# the PET's relay on listen:media_port (video) and media_port+1 (RomM web player).
media_port=7344
proxy_port=3128
# Switch the USB-C port to device mode and back (needs the sudoers rule in
# /usr/share/doc/alicepet/jackin/alicepet-jackin.sudoers). Empty = leave USB alone.
gadget_up=sudo -n /usr/libexec/alicepet/usb-gadget.sh up
gadget_down=sudo -n /usr/libexec/alicepet/usb-gadget.sh down
# Shown on the PC as "OPERATOR: <name>" and on Alice's chat ("HK:"), never the
# Windows account the app happens to run as.
operator=HK
