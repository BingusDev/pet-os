# AlicePET OS config. Installed as /etc/alicepet.conf (a dpkg conffile, so
# local edits survive upgrades). Desktop builds read this repository copy;
# ALICEPET_CONFIG=<path> overrides the location on both.

[bridge]
# Talk-to-Alice bridge (cardputer-pet-terminal bridge/server.mjs protocol):
# POST <url>/api/pet/ask {"input": "..."} -> {"ok": true, "reply": "..."}.
url=http://hks-mac-mini.tailcde1a1.ts.net:8797
# Bearer token = PET_BRIDGE_TOKEN on the Mac. Leave empty only if the bridge has none.
# Never commit a real token here; set it on the device after install.
token=
timeout_s=60

[netscan]
# host=<display name>|<address>|<probe>
# probe: tcp:<port>  -> ONLINE if a TCP connect succeeds
#        ps5         -> PlayStation discovery (UDP 9302): ONLINE / REST (standby) / OFFLINE
timeout_ms=1500
host=Mac mini|192.168.50.38|tcp:22
host=grandworld-pi|100.103.43.8|tcp:22
host=Jellyfin (media)|100.118.123.58|tcp:8096
host=NAS|192.168.50.237|tcp:445
host=PS5|192.168.50.199|ps5
host=Gaming PC|100.98.97.64|tcp:22
host=Mox (store)|100.115.21.77|tcp:22

[power]
# Nap after this many idle seconds (screen/backlight off, any key wakes to Home). 0 = never.
sleep_after_s=300
# Backlight sysfs dir; "auto" = first entry in /sys/class/backlight.
backlight=auto

[voice]
# Push-to-talk (hold SPACE on Home, or SPACE inside the VOICE chip). The WAV
# path is appended as the last argument; the recorder is stopped with SIGINT.
record_cmd=arecord -q -D default -f S16_LE -r 16000 -c 1 -t wav
max_s=30
# Optional spoken replies: the reply text is piped to this command's stdin.
# Empty = off (default). Example: tts_cmd=espeak-ng -v en-us -s 165
tts_cmd=
# Desktop simulator only: send this WAV instead of recording (no mic).
desktop_wav=

[terminal]
# SSH bookmarks: host=<label>|<ssh target>|<note>[|<port>]
# The target is passed to `ssh -tt`, so user@host or an alias from the PET's
# ~/.ssh/config both work. The PET uses its own SSH key (Phase 0 setup).
host=grandworld-pi|holden@100.103.43.8|Pi · home
host=grandworld-media|holden@100.118.123.58|Jellyfin box
host=mox|mox@100.115.21.77|store Pi
host=grandworld (VPS)|root@grandworld.cloud|Hostinger
host=gaming-pc|hkrip@100.98.97.64|Windows
host=macbook-air|HK@100.127.42.37|Fedora MBA
# Also list Host entries from this ssh_config that are not bookmarked ("" = off).
ssh_config_import=~/.ssh/config
ssh_cmd=ssh
